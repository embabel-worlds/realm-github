# Deterministic fast-path for stale review requests. Fires when the user
# is the requested reviewer and the request has been outstanding ≥ 48h.
# The host's planner picks this before the (more expensive) LLM triage
# on `github.pr_review_request` because of the cheap utility.
#
# This is a `stepType: policy` spec — a deterministic predicate over a
# signal, evaluated by the host without an LLM call. The sibling
# `stepType: triage` is the LLM-judged form. Both produce
# AttentionCandidates the host renders into notifications.

stepType: policy
name: pr_review_overdue
description: A review was requested from you and it's been over 48h

on: github.pr_review_request

whenExpr: "reviewer == $self and age >= 48h"

surface:
  tier: TIMELY
  headline: "Review #{number} overdue"
  why: "{repo}: {title}"
  url: "{url}"

# UtilityAI economics. Cost ~0 (AST walk); value 1.0. Net utility 0.99,
# which beats any LLM triage's typical 0.5 — the planner picks this
# first. If the predicate doesn't match, the planner escalates to the
# LLM triage automatically.
utility:
  cost: 0.01
  value: 1.0
