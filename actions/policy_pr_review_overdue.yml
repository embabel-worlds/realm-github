# Deterministic fast-path for stale review requests. Fires when the user
# is the requested reviewer and the request has been outstanding ≥ 48h.
# The host's planner picks this before the (more expensive) LLM judgment
# on `github.pr_review_request` because of the cheap utility.
#
# `stepType: policy` is a peer of the framework's `stepType: action`
# (PromptedActionSpec). Lives in `actions/` alongside LLM-driven specs;
# the framework's loader picks both up via NameOrClassTypeIdResolver.

stepType: policy
name: pr_review_overdue
description: A review was requested from you and it's been over 48h

inputTypeNames:
  - github.pr_review_request

whenExpr: "reviewer == $self and age >= 48h"

# Top-level cost/value, matching the framework's PromptedActionSpec
# convention. Cost ~0 (AST walk); value 1.0. Net utility 0.99 beats
# any LLM triage's typical 0.5 — the planner picks this first.
cost: 0.01
value: 1.0
