# Deterministic fast-path for direct @mentions in github PRs/issues.
# Fires when the user is mentioned and the mention is unacknowledged.

stepType: com.embabel.assistant.policy.spec.PolicyActionSpec
name: mention_unread
description: Direct @mention in a github PR or issue, unacknowledged

inputTypeNames:
  - github.mention

whenExpr: "mentioned == $self and not acknowledged"

cost: 0.01
value: 1.0
