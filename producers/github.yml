    title: "split(coalesce(r.message, ''), '\\n')[0]"
    coAuthors: "[l IN split(coalesce(r.message, ''), '\\n') WHERE toLower(l) STARTS WITH 'co-authored-by:' | trim(substring(l, 15))]"
    authorKind: "CASE WHEN r.authorType = 'Bot' AND any(a IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(coalesce(r.authorLogin, '')) CONTAINS a) THEN 'agent' WHEN r.authorType = 'Bot' OR coalesce(r.authorLogin, '') ENDS WITH '[bot]' THEN 'bot' WHEN any(l IN split(coalesce(r.message, ''), '\n') WHERE toLower(l) STARTS WITH 'co-authored-by:' AND any(a IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(l) CONTAINS a)) THEN 'assisted' WHEN r.authorType = 'User' THEN 'human' ELSE 'unknown' END"
    committerLogin: "CASE WHEN r.committerLoginRaw IS NULL OR r.committerLoginRaw = r.authorLogin THEN '' ELSE r.committerLoginRaw END"
    isMerge: "size(coalesce(r.parents, [])) > 1"
    isRevert: "coalesce(r.message, '') STARTS WITH 'Revert '"
    revertsSha: "coalesce(head([l IN split(coalesce(r.message, ''), '\\n') WHERE l STARTS WITH 'This reverts commit ' | split(substring(l, 20), '.')[0]]), '')"
    sourceUrl: "r.html_url"
  cost: { bucket: github-core, rate: 5000/hour }
  cache: { kind: ttl, seconds: 600, negativeTtlSeconds: 600 }

# A commit is immutable, so its files are cached a week. One call per commit: narrow the commits first.
- name: filesByCommit
  kind: remote
  operation: repos/get-commit        # GET /repos/{owner}/{repo}/commits/{ref} — the files, each with its counts and patch
  records: "$.files[*]"
  keyArgs: [owner, repo, ref]
  echoKeyAs: subjectCallKey
  batchSafe: false
  compute:                           # the FileChange contract; `r` is one diff entry plus the echoed subjectCallKey
    repositoryKey: "'github.com/' + toLower(split(r.blob_url, '/')[3] + '/' + split(r.blob_url, '/')[4])"
    subjectKey: "'github.com/' + toLower(split(r.blob_url, '/')[3] + '/' + split(r.blob_url, '/')[4]) + '@' + split(r.blob_url, '/')[6]"
    subjectKind: "'commit'"
    path: "r.filename"
    previousPath: "coalesce(r.previous_filename, '')"
    status: "CASE r.status WHEN 'changed' THEN 'modified' WHEN 'unchanged' THEN 'modified' ELSE r.status END"
    changedLines: "[x IN [h IN split(coalesce(r.patch, ''), '\\n') WHERE h STARTS WITH '@@' | split(split(h, '+')[1], ' ')[0]] | CASE WHEN x CONTAINS ',' THEN split(x, ',')[0] + '-' + toString(toInteger(split(x, ',')[0]) + toInteger(split(x, ',')[1]) - 1) ELSE x + '-' + x END]"
    sourceUrl: "r.blob_url"
  cost: { bucket: github-core, rate: 5000/hour }
  cache: { kind: ttl, seconds: 604800, negativeTtlSeconds: 3600 }

- name: filesByPull
  kind: remote
  operation: pulls/list-files        # GET /repos/{owner}/{repo}/pulls/{pull_number}/files — the PR's whole diff, file by file, in one call
  records: "$[*]"
  keyArgs: [owner, repo, pull_number]
  echoKeyAs: subjectCallKey
  batchSafe: false
  paging: { style: page, size: 100, maxPages: 3 }
  compute:                           # the FileChange contract; `r` is one diff entry plus the echoed subjectCallKey
    repositoryKey: "'github.com/' + toLower(split(r.blob_url, '/')[3] + '/' + split(r.blob_url, '/')[4])"
    subjectKey: "'github.com/' + toLower(split(r.subjectCallKey, '\\u001f')[0] + '/' + split(r.subjectCallKey, '\\u001f')[1]) + '#' + split(r.subjectCallKey, '\\u001f')[2]"   # the composite key reaches compute joined by U+001F
    subjectKind: "'change-request'"
    path: "r.filename"
    previousPath: "coalesce(r.previous_filename, '')"
    status: "CASE r.status WHEN 'changed' THEN 'modified' WHEN 'unchanged' THEN 'modified' ELSE r.status END"
    changedLines: "[x IN [h IN split(coalesce(r.patch, ''), '\\n') WHERE h STARTS WITH '@@' | split(split(h, '+')[1], ' ')[0]] | CASE WHEN x CONTAINS ',' THEN split(x, ',')[0] + '-' + toString(toInteger(split(x, ',')[0]) + toInteger(split(x, ',')[1]) - 1) ELSE x + '-' + x END]"
    sourceUrl: "r.blob_url"
  cost: { bucket: github-core, rate: 5000/hour }
  cache: { kind: ttl, seconds: 600, negativeTtlSeconds: 600 }
