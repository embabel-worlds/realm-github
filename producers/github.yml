# The forge's own language table for a repository: bytes of source per language, as GitHub's
# linguist counts it (vendored and generated files excluded). ONE object per repository —
# `{"Kotlin": 1234, "Java": 56}` — so the record is the whole map and `compute:` folds it into
# a list the views UNWIND; there is no array to make one record per language from.
- name: languagesByRepo
  kind: remote
  operation: repos/list-languages    # GET /repos/{owner}/{repo}/languages
  records: "$"
  keyArgs: [owner, repo]
  keySplit: "/"
  echoKeyAs: full_name
  maxKeysPerCall: 1
  compute:                           # the RepositoryLanguages contract; the record is the bare map, so the repository comes from the echoed key
    repositoryKey: "'github.com/' + toLower(coalesce(r.full_name, ''))"
    languages: "[k IN keys(r) WHERE NOT k IN ['full_name', 'repositoryKey', 'unit'] | k + ':' + toString(r[k])]"
    unit: "'bytes'"
  cost: { bucket: github-core, rate: 5000/hour }
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 3600 }
