# Virtual-join producers (see specs/VIRTUAL_CYPHER.md). Batch-keyed: all author
# logins go into ONE GitHub issue search. GitHub OR-s repeated `author:`
# qualifiers, so `keyTemplate: "author:{key}"` turns [alice, bob] into
# "author:alice author:bob", substituted into the `{keys}` placeholder of `q` —
# one call covers every anchor, no N+1.
#
# per_page=100 (GitHub's max) + sort by most-recently-updated: a prolific login can
# have thousands of matches and GitHub paginates, so the materialized set is the 100
# most-recent. That makes counts over a focused/active repo correct, and lets a
# cross-identity intersection (issues X raised that Y is assigned to) hit recent
# overlaps. A login with >100 matches across ALL repos is still floor-capped — the
# decompose-and-intersect model can't beat a single combined search for that.

- name: issuesByAuthor
  kind: api
  operation: search/issues-and-pull-requests   # GET /search/issues (q)
  records: "$.items[*]"
  args:
    q: "is:issue {keys}"
    sort: updated
    order: desc
    per_page: 100
  keyTemplate: "author:{key}"
  keyJoin: " "
  cache:
    kind: ttl
    seconds: 300

# Issues assigned to an author login — same batched search, `assignee:` qualifier.
- name: issuesByAssignee
  kind: api
  operation: search/issues-and-pull-requests
  records: "$.items[*]"
  args:
    q: "is:issue {keys}"
    sort: updated
    order: desc
    per_page: 100
  keyTemplate: "assignee:{key}"
  keyJoin: " "
  cache:
    kind: ttl
    seconds: 300

# Pull requests, same batched search but `is:pr`. Mirror of the issue producers
# so a GitHubPullRequest materializes by author / assignee off a GitHubIdentity.
- name: pullsByAuthor
  kind: api
  operation: search/issues-and-pull-requests
  records: "$.items[*]"
  args:
    q: "is:pr {keys}"
    sort: updated
    order: desc
    per_page: 100
  keyTemplate: "author:{key}"
  keyJoin: " "
  cache:
    kind: ttl
    seconds: 300

- name: pullsByAssignee
  kind: api
  operation: search/issues-and-pull-requests
  records: "$.items[*]"
  args:
    q: "is:pr {keys}"
    sort: updated
    order: desc
    per_page: 100
  keyTemplate: "assignee:{key}"
  keyJoin: " "
  cache:
    kind: ttl
    seconds: 300

# Person email → GitHub login, for persisted GitHubIdentity enrichment. MUST be a
# purpose-shaped handler that ECHOES the queried email in each record — GitHub's
# learned /search/users returns login but not email, so a raw learned-API op
# can't satisfy recordKeyField=email. Until such a handler ships, this resolves
# to no tool (enrichment is a no-op, logged).
- name: githubUsersByEmail
  kind: api
  operation: githubUserByEmail   # purpose-shaped pack handler, returns {email, login}
  records: "$[*]"
  keyArg: emails
  cache:
    kind: ttl
    seconds: 86400
