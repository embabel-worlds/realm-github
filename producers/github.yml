# Virtual-join producers (see specs/VIRTUAL_CYPHER.md). These are RemoteRepositories
# (kind: remote; `api` still accepted as an alias) — keyed readers over an external store,
# in the Spring Data sense.
#
# ONE AUTHOR PER CALL (`batchSafe: false`). GitHub's issue search returns a SINGLE global
# list sorted by `updated` desc, capped at `maxPages * size` (1000) results. OR-batching
# authors (`author:alice author:bob`) into one call therefore STARVES a low-volume author:
# a prolific author's recent issues fill the 1000-result cap and a colleague's single old
# issue falls off the end — so "who raised issues I email" can list someone whom the
# follow-up "what did they raise" then finds nothing for (the answer even shifts with WHICH
# authors share the batch). Per-author fetch gives every login its own 1000-result budget,
# so results are complete per author and the two questions always agree. The cost is N calls
# for N authors; the resolution optimizer budgets that against the rate bucket. `batchSafe: false`
# is a declared CAPABILITY (the engine derives one-key-per-call from it), not a magic batch size.
#
# PREDICATE PUSHDOWN (Level 1): a query predicate on the materialized issue/PR — e.g.
# `WHERE i.html_url CONTAINS 'embabel/me'` — is rendered by the `pushdown` rules into a native
# GitHub `repo:owner/name` qualifier and substituted for `{filters}` in `q`, scoping the search
# AT THE SOURCE. `valuePattern` pulls `owner/repo` out of whatever URL form the predicate used.
#
# THE VOCABULARY CONTRACT. GitHubIssue is a child of the dev vocabulary's Issue and
# GitHubPullRequest of its ChangeRequest (types/github.yml), so each producer maps GitHub's record
# onto the parent's names. `project:` LIFTS a nested field to a scalar (user.type, labels[*].name);
# `compute:` says what a field MEANS, as one Cypher expression over the record bound as `r` — the
# record as GitHub hands it over plus whatever `project` lifted. Computed keys are stored beside the
# declared ones, so i.authorKind, i.status, i.key read on an :Issue as on a :GitHubIssue. The same
# block is on every producer of a type, so the contract's names read the same whichever hop fetched
# the row.
#
# authorKind, the field the vocabulary exists for: GitHub marks a machine account as user.type
# 'Bot' and an app's act as performed_via_github_app. A Bot whose login names a coding agent is
# 'agent' (the list is the vocabulary's; extend it here when a new one appears); any other Bot or
# app act is 'bot'; a record whose body carries a Co-Authored-By trailer or Claude Code's
# "Generated with" marker is 'assisted' — a person's record declaring an agent's hand; a plain
# User is 'human'. The honest limit: agent text pasted with no marker reads as human.
#
# PAGINATION: `paging:` walks pages (sort=updated, size 100, up to maxPages) so an author whose
# issues exceed one page (e.g. 249 issues) is fully captured — without it the fetch would
# floor-cap at the first 100 and a cross-identity intersection could miss matches.

- name: issuesByAuthor
  kind: remote
  operation: search/issues-and-pull-requests   # GET /search/issues (q)
  records: "$.items[*]"
  args:
    q: "is:issue {keys} {filters}"
    sort: updated
    order: desc
  keyTemplate: "author:{key}"
  keyJoin: " "
  cost: { bucket: github-search, rate: 30/min }   # shares GitHub's one Search API budget with all search ops
  batchSafe: false             # globally-ranked, capped search → engine fetches one author per call
  pushdown:
    - property: html_url
      qualifier: "repo:{value}"
      valuePattern: '(?:github\.com/|repos/)?([\w.-]+/[\w.-]+?)(?:/|$)'
  paging: { style: page, size: 100, maxPages: 10 }
  project:                           # lifts for the Issue contract (see the header): nested fields as scalars
    authorLogin: user.login
    authorType: user.type            # 'User' or 'Bot' — the first word of authorKind
    viaApp: performed_via_github_app.slug
    labelNames: "labels[*].name"
    milestone: milestone.title
    assigneeLogins: "assignees[*].login"
    prUrl: pull_request.url          # present only when this 'issue' is a pull request
    prMergedAt: pull_request.merged_at   # and when it was merged, if it was
  compute:                           # the Issue contract; `r` is the record plus what project lifted
    key: "'github.com/' + toLower(split(r.html_url, '/')[3] + '/' + split(r.html_url, '/')[4]) + '#' + toString(r.number)"
    repositoryKey: "'github.com/' + toLower(split(r.html_url, '/')[3] + '/' + split(r.html_url, '/')[4])"
    status: "r.state"
    resolution: "CASE r.state_reason WHEN 'completed' THEN 'completed' WHEN 'not_planned' THEN 'not-planned' WHEN 'duplicate' THEN 'duplicate' ELSE '' END"
    kind: "CASE WHEN any(l IN coalesce(r.labelNames, []) WHERE toLower(l) CONTAINS 'bug') THEN 'bug' WHEN any(l IN coalesce(r.labelNames, []) WHERE toLower(l) CONTAINS 'enhancement' OR toLower(l) CONTAINS 'feature') THEN 'feature' WHEN any(l IN coalesce(r.labelNames, []) WHERE toLower(l) CONTAINS 'question') THEN 'question' WHEN any(l IN coalesce(r.labelNames, []) WHERE toLower(l) CONTAINS 'doc') THEN 'documentation' WHEN any(l IN coalesce(r.labelNames, []) WHERE toLower(l) CONTAINS 'task' OR toLower(l) CONTAINS 'chore') THEN 'task' ELSE '' END"
    labels: "r.labelNames"
    authorKind: "CASE WHEN r.authorType = 'Bot' AND any(a IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(coalesce(r.authorLogin, '')) CONTAINS a) THEN 'agent' WHEN r.authorType = 'Bot' OR r.viaApp IS NOT NULL THEN 'bot' WHEN any(l IN split(coalesce(r.body, ''), '\n') WHERE toLower(l) STARTS WITH 'co-authored-by:' AND any(a IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(l) CONTAINS a)) OR coalesce(r.body, '') CONTAINS 'Generated with [Claude Code]' THEN 'assisted' WHEN r.authorType = 'User' THEN 'human' ELSE 'unknown' END"
    authorRole: "CASE r.author_association WHEN 'OWNER' THEN 'owner' WHEN 'MEMBER' THEN 'member' WHEN 'COLLABORATOR' THEN 'collaborator' WHEN 'CONTRIBUTOR' THEN 'contributor' WHEN 'FIRST_TIME_CONTRIBUTOR' THEN 'first-timer' WHEN 'FIRST_TIMER' THEN 'first-timer' WHEN 'NONE' THEN 'outsider' ELSE '' END"
    isChangeRequest: "r.prUrl IS NOT NULL"
    mergedAt: "r.prMergedAt"
    openedAt: "r.created_at"
    updatedAt: "r.updated_at"
    closedAt: "r.closed_at"
    commentCount: "r.comments"
    sourceUrl: "r.html_url"
    owner: "split(r.html_url, '/')[3]"              # with repo and number, the key a per-issue fetch (comments, reviews, commits, files) is made under
    repo: "split(r.html_url, '/')[4]"
  cache:
    kind: ttl
    seconds: 300

