# The answer surface over the dev vocabulary: one view per question the realm now exists to
# answer — who writes what, and whether it was a person, a bot, a coding agent or a person with
# an agent's help. Every view pins the repository from its `repo` parameter, filters on PROJECTED
# variables so the fetch stays one cache key per repository, and limits a terminal result by
# collect + list slice rather than LIMIT (the rules realm-github-actions/views/actions.yml
# explains). NO TOP-N BEFORE A HOP: the repository doors are capped at 1,000, and a ranked
# LIMIT over a capped read is provable only as the query's LAST clause and only on the node's own
# property in the producer's declared `orderedBy:` (then the page walk stops at N, one call). A
# ranked LIMIT followed by a hop, or preceded by a graph-side filter, is refused as unprovable
# (embabel/me, filed from this realm). So the views that hop — reviews, files — take a `since`
# window that GitHub applies itself (list-for-repo's and list-commits' `since`), which both
# completes the fetch and bounds the hop's anchors. Every window has an `until` too, applied in
# the graph (empty = open-ended): a harness that reconciles a view against GitHub needs a window
# that stops before "now", or a comment posted between its two reads moves the figure. The issue
# door pushes an openedAt bound as GitHub's `since` (updated_at, a superset the graph refines), so
# "opened since X" is a complete read, not the newest 1,000 reported PARTIAL. Every view's
# description repeats the vocabulary's honest limit: a person who pasted an agent's text with no
# trailer and no marker counts as human.
#
# THE DOORS. Comments and commits are read newest first through the repository door, up to
# 1,000 each (10 pages), with `since` pushed to GitHub when a literal lower bound is given; a
# window further back than the newest 1,000 is reported PARTIAL. Reviews, a PR's line comments
# and a commit's files are one call per subject, so the views that hop to them bound the
# subjects first with ORDER BY … LIMIT $n directly before the hop.

- name: GitHubAuthorship
  description: >-
    SELECT THIS for "what share of the work in owner/repo is machine-generated", "how many
    pull requests / issues / comments / commits were written by bots, by coding agents, by
    people with an agent's help", "human versus machine in owner/repo". One row per record kind
    (issue, change-request, comment — on the conversation, review-comment — on a line of a
    diff, commit) and authorKind, with the count and its share of that kind. The `since` bound is
    pushed to GitHub for every kind, so a window is a complete read up to 1,000 records per kind.
    A person who pasted an agent's text with no trailer and no marker counts as human here.
  params:
    repo:  { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    since: { type: string, default: "1970-01-01T00:00:00Z", description: "ISO-8601 lower bound on when each record was written; pushed to GitHub." }
    until: { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on when each record was written; empty for no bound." }
  cypher: |
    MATCH (r:GitHubRepository {full_name: $repo})
    CALL {
      WITH r
      MATCH (r)-[:HAS_ISSUE]->(i:Issue)
      WITH i, i.openedAt AS openedAt, i.isChangeRequest AS isPr, i.authorKind AS ik
      WHERE openedAt >= $since AND ($until = '' OR openedAt < $until)
      RETURN CASE WHEN isPr THEN 'change-request' ELSE 'issue' END AS recordKind, ik AS authorKind
      UNION ALL
      WITH r
      MATCH (r)-[:HAS_COMMENT]->(c:Comment)
      WITH c, c.createdAt AS createdAt, c.authorKind AS ck
      WHERE createdAt >= $since AND ($until = '' OR createdAt < $until)
      RETURN 'comment' AS recordKind, ck AS authorKind
      UNION ALL
      WITH r
      MATCH (r)-[:HAS_REVIEW_COMMENT]->(l:Comment)
      WITH l, l.createdAt AS lineCreatedAt, l.authorKind AS lk
      WHERE lineCreatedAt >= $since AND ($until = '' OR lineCreatedAt < $until)
      RETURN 'review-comment' AS recordKind, lk AS authorKind
      UNION ALL
      WITH r
      MATCH (r)-[:HAS_COMMIT]->(m:Commit)
      WITH m, m.authoredAt AS authoredAt, m.authorKind AS mk
      WHERE authoredAt >= $since AND ($until = '' OR authoredAt < $until)
      RETURN 'commit' AS recordKind, mk AS authorKind
    }
    WITH recordKind, authorKind, count(*) AS n
    WITH recordKind, collect({authorKind: authorKind, n: n}) AS byKind, sum(n) AS total
    UNWIND byKind AS b
    RETURN recordKind, b.authorKind AS authorKind, b.n AS n,
           round(100.0 * b.n / total, 1) AS pct
    ORDER BY recordKind, n DESC

- name: GitHubChangeRequestsByAuthorKind
  description: >-
    SELECT THIS for "pull requests opened by coding agents versus people in owner/repo, by
    month", "how do agent-opened PRs end — merged or closed", "agent PR merge rate", "are
    assisted PRs merged faster". One row per month, authorKind and outcome (open, merged,
    closed), with the count and the mean hours from opening to merge for the merged ones.
    The `since` bound is pushed to GitHub, so a window is a complete read up to 1,000 pull
    requests. Assisted means a person's PR whose description declares an agent generated it; a
    PR an agent wrote with no marker counts as human.
  params:
    repo:  { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    since: { type: string, default: "1970-01-01T00:00:00Z", description: "ISO-8601 lower bound on openedAt; pushed to GitHub." }
    until: { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on openedAt; empty for no bound." }
  # Through the ISSUE door, not HAS_PULL_REQUEST: GitHub's pulls/list takes no `since`, so that door
  # is always the newest 1,000 and a count over it a lower bound; list-for-repo narrows at the source.
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:HAS_ISSUE]->(pr:Issue)
    WITH pr, pr.openedAt AS openedAt, pr.isChangeRequest AS isPr, pr.mergedAt AS mergedAt, pr.status AS state, pr.authorKind AS authorKind
    WHERE openedAt >= $since AND ($until = '' OR openedAt < $until) AND isPr = true
    WITH substring(openedAt, 0, 7) AS month, authorKind,
         CASE WHEN mergedAt IS NOT NULL THEN 'merged' ELSE state END AS status,
         count(pr) AS n,
         avg(CASE WHEN mergedAt IS NULL THEN null
                  ELSE duration.inSeconds(datetime(openedAt), datetime(mergedAt)).seconds / 3600.0 END) AS meanHoursToMerge
    RETURN month, authorKind, status, n,
           CASE WHEN meanHoursToMerge IS NULL THEN null ELSE round(meanHoursToMerge, 1) END AS meanHoursToMerge
    ORDER BY month, authorKind, status

- name: GitHubChangeRequestThroughput
  description: >-
    SELECT THIS for "PR merge rate last week in owner/repo", "how many pull requests were merged
    or closed this month, this quarter, this year", "PR volume by week, human versus machine",
    "pull request throughput by period and author kind", "how many PRs did agents open last
    quarter and how many of them were merged". One row per period (week, month, quarter or year,
    named by its first UTC day) and authorKind, plus an 'all' row per period, with: opened (PRs
    opened in the period), merged (merged in it), closedUnmerged (closed without merging in it),
    resolved (merged + closedUnmerged), mergedPctOfResolved, and the mean hours from opening to
    merge for the ones merged in it. Each event is counted in the period it happened, so a PR
    opened in March and merged in April is in both periods, and a period's merges may exceed its
    openings. The `since` bound is pushed to GitHub, so a window is a complete read up to 1,000
    pull requests touched since it. Assisted means a person's PR whose description declares an
    agent generated it; a PR an agent wrote with no marker counts as human.
  params:
    repo:   { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    period: { type: string, default: "week", description: "The time box: week (ISO, Monday start), month, quarter or year." }
    since:  { type: string, default: "2026-01-01T00:00:00Z", description: "ISO-8601 lower bound on when each event happened; pushed to GitHub as an updated-since bound the graph refines." }
    until:  { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on when each event happened; empty for no bound." }
  # Three dated events per PR, unwound so each lands in the period it happened in: a PR is opened once,
  # and then either merged or closed, never both. The updatedAt bound is the one GitHub applies: any of
  # the three events after X moved updated_at past X, so the read is a superset the graph narrows.
  # The second UNWIND counts every event once more under 'all', so "merge rate last week" is one row.
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:HAS_ISSUE]->(pr:Issue)
    WHERE pr.updatedAt >= $since
    WITH pr, pr.isChangeRequest AS isPr, pr.authorKind AS authorKind, pr.openedAt AS openedAt, pr.mergedAt AS mergedAt, pr.closedAt AS closedAt
    WHERE isPr = true
    UNWIND [{at: openedAt, event: 'opened'}, {at: mergedAt, event: 'merged'}, {at: CASE WHEN mergedAt IS NULL THEN closedAt ELSE null END, event: 'closed'}] AS ev
    WITH authorKind, openedAt, mergedAt, ev
    WHERE ev.at IS NOT NULL AND ev.at >= $since AND ($until = '' OR ev.at < $until)
    UNWIND [authorKind, 'all'] AS kind
    WITH toString(date.truncate($period, datetime(ev.at))) AS period, kind,
         sum(CASE ev.event WHEN 'opened' THEN 1 ELSE 0 END) AS opened,
         sum(CASE ev.event WHEN 'merged' THEN 1 ELSE 0 END) AS merged,
         sum(CASE ev.event WHEN 'closed' THEN 1 ELSE 0 END) AS closedUnmerged,
         avg(CASE WHEN ev.event = 'merged' THEN duration.inSeconds(datetime(openedAt), datetime(mergedAt)).seconds / 3600.0 ELSE null END) AS meanHoursToMerge
    RETURN period, kind AS authorKind, opened, merged, closedUnmerged, merged + closedUnmerged AS resolved,
           CASE WHEN merged + closedUnmerged = 0 THEN null ELSE round(100.0 * merged / (merged + closedUnmerged), 1) END AS mergedPctOfResolved,
           CASE WHEN meanHoursToMerge IS NULL THEN null ELSE round(meanHoursToMerge, 1) END AS meanHoursToMerge
    ORDER BY period, authorKind

- name: GitHubReviewBurden
  description: >-
    SELECT THIS for "do agent-written pull requests draw more review than human ones in
    owner/repo", "how many human review comments does an assisted PR get", "review burden by
    author kind", "who reviews the agents' work". For the pull requests MERGED in a window:
    one row per PR authorKind, with PRs, the mean number of review-line comments per PR, how
    many of those comments came from people, the mean number of reviews per PR, and how many
    PRs had changes requested. GitHub narrows the read to `since` itself; then one call per PR
    for its reviews and one for its line comments, so keep the window to what a hundred PRs
    cover. Assisted means a person's PR whose description declares an agent generated it; a PR
    an agent wrote with no marker counts as human.
  params:
    repo:  { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    since: { type: string, default: "2026-10-01T00:00:00Z", description: "ISO-8601 lower bound on mergedAt, pushed to GitHub (as an updated-since bound the graph refines). Keep it to a window of at most a hundred merged PRs." }
    until: { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on mergedAt; empty for no bound." }
  # A PR merged after X was updated after X, so the updatedAt bound is what GitHub applies and
  # mergedAt is the window — a merge time never moves, where updatedAt moves on every later comment.
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:HAS_ISSUE]->(pr:Issue)
    WHERE pr.updatedAt >= $since
    WITH pr, pr.isChangeRequest AS isPr, pr.mergedAt AS mergedAt, pr.authorKind AS authorKind
    WHERE isPr = true AND mergedAt IS NOT NULL AND mergedAt >= $since AND ($until = '' OR mergedAt < $until)
    OPTIONAL MATCH (pr)-[:HAS_REVIEW]->(rv:Review)
    WITH pr, authorKind, collect(rv.verdict) AS verdicts
    OPTIONAL MATCH (pr)-[:HAS_REVIEW_COMMENT]->(c:Comment)
    WITH pr, authorKind, verdicts, collect(c.authorKind) AS commentKinds
    WITH authorKind, count(pr) AS prs,
         sum(size(commentKinds)) AS lineCommentsTotal,
         sum(size([k IN commentKinds WHERE k = 'human'])) AS humanLineComments,
         sum(size(verdicts)) AS reviewsTotal,
         sum(CASE WHEN 'changes-requested' IN verdicts THEN 1 ELSE 0 END) AS prsWithChangesRequested
    RETURN authorKind, prs,
           round(1.0 * lineCommentsTotal / prs, 2) AS lineCommentsPerPr,
           humanLineComments,
           round(1.0 * reviewsTotal / prs, 2) AS reviewsPerPr,
           prsWithChangesRequested
    ORDER BY prs DESC

- name: GitHubCommitSize
  description: >-
    SELECT THIS for "how big are the agents' commits compared with people's in owner/repo",
    "lines and files per commit by author kind", "do assisted commits touch more files", "do
    the agents ship tests". For the non-merge commits on the default branch authored since a
    date: one row per authorKind with commits, mean and largest files changed, mean and
    largest lines changed (additions plus deletions), and how many touched a test file.
    GitHub narrows the read to `since` itself; then one call per commit for its files (cached a
    week), so keep the window to what a hundred commits cover.
  params:
    repo:  { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    since: { type: string, default: "2026-10-01T00:00:00Z", description: "ISO-8601 lower bound on the author date, pushed to GitHub. Keep it to a window of at most a hundred commits." }
    until: { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on the author date; empty for no bound." }
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:HAS_COMMIT]->(c:Commit)
    WITH c, c.authoredAt AS authoredAt, c.isMerge AS isMerge, c.authorKind AS authorKind
    WHERE authoredAt >= $since AND ($until = '' OR authoredAt < $until) AND isMerge = false
    MATCH (c)-[:CHANGED]->(f:FileChange)
    WITH c, authorKind, count(f) AS files, sum(f.additions + f.deletions) AS lines,
         sum(CASE WHEN f.kind = 'test' THEN 1 ELSE 0 END) AS testFiles
    WITH authorKind, count(c) AS commits,
         avg(files) AS meanFiles, max(files) AS maxFiles,
         avg(lines) AS meanLines, max(lines) AS maxLines,
         sum(CASE WHEN testFiles > 0 THEN 1 ELSE 0 END) AS commitsTouchingTests
    RETURN authorKind, commits, round(meanFiles, 1) AS meanFiles, maxFiles, round(meanLines, 1) AS meanLines, maxLines, commitsTouchingTests
    ORDER BY commits DESC

- name: GitHubFileHotspots
  description: >-
    SELECT THIS for "which files change most in owner/repo", "hotspots", "the files the
    agents keep touching", "what changed since a date". For the non-merge commits authored
    since a date: one row per file path with how many commits touched it, lines changed, and
    how many of those commits were by people, by agents (assisted or agent) and by bots.
    GitHub narrows the read to `since` itself; then one call per commit (cached a week), so
    keep the window to what a hundred commits cover.
  params:
    repo:  { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    since: { type: string, default: "2026-10-01T00:00:00Z", description: "ISO-8601 lower bound on the author date, pushed to GitHub." }
    until: { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on the author date; empty for no bound." }
    limit: { type: int, default: 25, description: "How many paths to return." }
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:HAS_COMMIT]->(c:Commit)
    WITH c, c.authoredAt AS authoredAt, c.isMerge AS isMerge
    WHERE authoredAt >= $since AND ($until = '' OR authoredAt < $until) AND isMerge = false
    MATCH (c)-[:CHANGED]->(f:FileChange)
    WITH f.path AS path, count(DISTINCT c) AS commits, sum(f.additions + f.deletions) AS lines,
         sum(CASE WHEN c.authorKind = 'human' THEN 1 ELSE 0 END) AS byHumans,
         sum(CASE WHEN c.authorKind IN ['assisted', 'agent'] THEN 1 ELSE 0 END) AS byAgents,
         sum(CASE WHEN c.authorKind = 'bot' THEN 1 ELSE 0 END) AS byBots
    ORDER BY commits DESC, lines DESC
    WITH collect({path: path, commits: commits, lines: lines, byHumans: byHumans, byAgents: byAgents, byBots: byBots}) AS rows
    UNWIND rows[0..$limit] AS row
    RETURN row.path AS path, row.commits AS commits, row.lines AS lines, row.byHumans AS byHumans, row.byAgents AS byAgents, row.byBots AS byBots

# JUDGED, NOT DECLARED. authorKind reports what the record declares — the account's type, a
# trailer, a marker. The two views below ask a model what the TEXT reads as, which is the only way
# to see the vocabulary's honest limit: a person who pasted an agent's prose with no marker is
# `human` to authorKind and, often, `machine` to a reader. The judgment is a model's opinion,
# non-deterministic, and one batched call per view (§7.5 of the Virtual Cypher spec): keep the
# window small. Every row keeps both values; nothing is overwritten.

- name: GitHubCommentReadsAs
  description: >-
    SELECT THIS for "does this comment read as written by a person or a machine", "which
    comments in owner/repo look AI-generated", "comments whose author is a person but whose
    text reads as machine-written". For the conversation comments written since a date: one row
    per comment with the declared authorKind (what the record says: human, bot, agent,
    assisted), the judged label (what a model says the text reads as: human, machine or unsure),
    whether the two agree, the author, where it was said and the opening words. One batched
    model call over the window; keep `since` to a window of a few hundred comments at most. The
    judged label is an opinion, not a fact: the declared authorKind is the fact.
  params:
    repo:  { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    since: { type: string, default: "2026-10-25T00:00:00Z", description: "ISO-8601 lower bound on createdAt, pushed to GitHub. Keep the window small: every comment in it is judged." }
    until: { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on createdAt; empty for no bound." }
    only:  { type: string, default: "", description: "Leave empty for every comment, or 'disagree' for only the comments whose judged label contradicts the declared kind." }
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:HAS_COMMENT]->(c:Comment)
    WITH c, c.createdAt AS createdAt
    WHERE createdAt >= $since AND ($until = '' OR createdAt < $until)
    WITH c, c.authorKind AS declared, c.authorLogin AS author, c.subjectKey AS on, c.createdAt AS at, c.sourceUrl AS url,
         ai.classify(c, 'Does the comment TEXT read as written by a person or generated by a machine? machine: templated or tool output (quality-gate reports, dependency bumps, CI or coverage summaries, badges) or model-generated prose (uniform structure, exhaustive bullet lists, bold labels and headers, hedged summary sentences, no situated first-person detail). human: conversational, situated, terse, idiosyncratic, or clearly reacting to something specific. unsure: too short or too generic to tell. Answer one of: human, machine, unsure') AS judged
    WITH c, declared, judged, author, on, at, url,
         CASE WHEN judged = 'unsure' THEN 'unsure'
              WHEN (declared = 'human' AND judged = 'human') OR (declared <> 'human' AND judged = 'machine') THEN 'agree'
              ELSE 'disagree' END AS agreement
    WHERE $only = '' OR agreement = $only
    RETURN declared, judged, agreement, author, on, at, left(c.body, 90) AS opening, url
    ORDER BY agreement, at DESC

- name: GitHubCommentProvenance
  description: >-
    SELECT THIS for "how much of what reads as machine-written in owner/repo is declared as
    such", "how good is the declared authorKind", "how many human-attributed comments look
    AI-generated". For the conversation comments written since a date: one row per declared
    authorKind and judged label with the count — the agreement matrix between what the records
    declare and what a model says the text reads as. The off-diagonal cell declared=human,
    judged=machine is the vocabulary's honest limit made visible: agent text posted under a
    person's account with no marker. One batched model call over the window; keep `since`
    to a window of a few hundred comments at most.
  params:
    repo:  { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    since: { type: string, default: "2026-10-25T00:00:00Z", description: "ISO-8601 lower bound on createdAt, pushed to GitHub." }
    until: { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on createdAt; empty for no bound." }
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:HAS_COMMENT]->(c:Comment)
    WITH c, c.createdAt AS createdAt
    WHERE createdAt >= $since AND ($until = '' OR createdAt < $until)
    WITH c.authorKind AS declared,
         ai.classify(c, 'Does the comment TEXT read as written by a person or generated by a machine? machine: templated or tool output (quality-gate reports, dependency bumps, CI or coverage summaries, badges) or model-generated prose (uniform structure, exhaustive bullet lists, bold labels and headers, hedged summary sentences, no situated first-person detail). human: conversational, situated, terse, idiosyncratic, or clearly reacting to something specific. unsure: too short or too generic to tell. Answer one of: human, machine, unsure') AS judged
    WITH declared, judged, count(*) AS n
    RETURN declared, judged, n ORDER BY declared, judged

# SIZE AND SHAPE OF A CHANGE. The forge's list of pull requests carries no file counts (the
# vocabulary leaves ChangeRequest.filesChanged empty where the list does not), so size is read
# from the diff: one call per change request for its files, each file carrying the vocabulary's
# `kind` (source, test, docs, build, config, data, other — decided from the path by the rule in
# realm-dev-vocabulary, identically on every forge) and a language read off its extension. Every
# view below says :ChangeRequest / :Issue and :FileChange, never GitHub; the anchor is the
# repository pin. The window is `openedAt`, pushed to GitHub as `updatedAt >= since` through the
# ISSUE door (pull requests are issues to GitHub's list, and only that door pushes a date), then
# re-applied exactly here; a status read through that door is the Issue's (open/closed), so a
# merged change request is recognised by its mergedAt. The diff fetch is the cost: about a second per change request cold
# (cached an hour after), so the default windows hold tens of change requests, not thousands.

- name: GitHubChangeRequestSize
  description: >-
    SELECT THIS for "how big are the PRs in owner/repo", "files changed per pull request", "what
    languages did each PR touch", "how much of PR 123 was tests", "the largest pull requests this
    month", "lines of documentation per change". For the change requests OPENED in a window: one
    row per change request with its author and authorKind, status, files, lines added and deleted,
    the number of files and the lines changed per kind (source, test, docs, build, config, data,
    other), and the code languages it touched with the lines changed in each, largest first. One
    diff fetch per change request, about a second each cold: keep the window to a hundred or so.
  params:
    repo:  { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    since: { type: string, default: "2026-10-25T00:00:00Z", description: "ISO-8601 lower bound on openedAt, pushed to GitHub. Every change request in the window costs one call; keep it to a hundred or so." }
    until: { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on openedAt; empty for no bound." }
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:HAS_ISSUE]->(pr:Issue)
    WITH pr, pr.updatedAt AS updatedAt, pr.isChangeRequest AS isPr, pr.openedAt AS openedAt
    WHERE updatedAt >= $since AND isPr = true AND openedAt >= $since AND ($until = '' OR openedAt < $until)
    MATCH (pr)-[:CHANGED]->(f:FileChange)
    WITH pr, f.kind AS kind, head([e IN [CASE WHEN last(split(f.path, '/')) CONTAINS '.' THEN toLower(last(split(f.path, '.'))) ELSE '' END] | CASE e WHEN 'kt' THEN 'Kotlin' WHEN 'kts' THEN 'Kotlin' WHEN 'java' THEN 'Java' WHEN 'scala' THEN 'Scala' WHEN 'groovy' THEN 'Groovy' WHEN 'ts' THEN 'TypeScript' WHEN 'tsx' THEN 'TypeScript' WHEN 'js' THEN 'JavaScript' WHEN 'mjs' THEN 'JavaScript' WHEN 'cjs' THEN 'JavaScript' WHEN 'jsx' THEN 'JavaScript' WHEN 'vue' THEN 'Vue' WHEN 'svelte' THEN 'Svelte' WHEN 'py' THEN 'Python' WHEN 'go' THEN 'Go' WHEN 'rs' THEN 'Rust' WHEN 'rb' THEN 'Ruby' WHEN 'php' THEN 'PHP' WHEN 'cs' THEN 'C#' WHEN 'fs' THEN 'F#' WHEN 'swift' THEN 'Swift' WHEN 'c' THEN 'C' WHEN 'h' THEN 'C' WHEN 'cc' THEN 'C++' WHEN 'cpp' THEN 'C++' WHEN 'cxx' THEN 'C++' WHEN 'hpp' THEN 'C++' WHEN 'sh' THEN 'Shell' WHEN 'bash' THEN 'Shell' WHEN 'zsh' THEN 'Shell' WHEN 'ps1' THEN 'PowerShell' WHEN 'sql' THEN 'SQL' WHEN 'cypher' THEN 'Cypher' WHEN 'html' THEN 'HTML' WHEN 'htm' THEN 'HTML' WHEN 'css' THEN 'CSS' WHEN 'scss' THEN 'CSS' WHEN 'less' THEN 'CSS' WHEN 'dart' THEN 'Dart' WHEN 'lua' THEN 'Lua' WHEN 'pl' THEN 'Perl' WHEN 'r' THEN 'R' WHEN 'jl' THEN 'Julia' WHEN 'ex' THEN 'Elixir' WHEN 'exs' THEN 'Elixir' WHEN 'erl' THEN 'Erlang' WHEN 'hs' THEN 'Haskell' WHEN 'ml' THEN 'OCaml' WHEN 'elm' THEN 'Elm' WHEN 'clj' THEN 'Clojure' WHEN 'proto' THEN 'Protobuf' WHEN 'graphql' THEN 'GraphQL' WHEN 'tf' THEN 'Terraform' WHEN 'wasm' THEN 'WebAssembly' WHEN 'ipynb' THEN 'Jupyter' WHEN 'jinja' THEN 'Jinja' WHEN 'j2' THEN 'Jinja' WHEN 'ftl' THEN 'FreeMarker' WHEN 'mustache' THEN 'Mustache' WHEN 'hbs' THEN 'Handlebars' WHEN 'jsp' THEN 'JSP' ELSE '' END]) AS lang, count(f) AS files, sum(f.additions) AS added, sum(f.deletions) AS deleted
    WITH pr, collect({kind: kind, lang: lang, files: files, lines: added + deleted, added: added, deleted: deleted}) AS cells
    UNWIND cells AS c
    WITH pr, cells, c.lang AS lang, sum(c.lines) AS lines
    ORDER BY lines DESC
    WITH pr, cells, collect(CASE WHEN lang = '' THEN null ELSE lang + ':' + toString(lines) END) AS languages
    RETURN pr.number AS number, pr.title AS title, pr.authorLogin AS author, pr.authorKind AS authorKind,
           CASE WHEN pr.mergedAt IS NULL THEN pr.status ELSE 'merged' END AS status, pr.openedAt AS openedAt,
           reduce(a = 0, c IN cells | a + c.files) AS files,
           reduce(a = 0, c IN cells | a + c.added) AS additions,
           reduce(a = 0, c IN cells | a + c.deleted) AS deletions,
           reduce(a = 0, c IN cells | a + CASE WHEN c.kind = 'source' THEN c.files ELSE 0 END) AS sourceFiles,
           reduce(a = 0, c IN cells | a + CASE WHEN c.kind = 'test' THEN c.files ELSE 0 END) AS testFiles,
           reduce(a = 0, c IN cells | a + CASE WHEN c.kind = 'docs' THEN c.files ELSE 0 END) AS docsFiles,
           reduce(a = 0, c IN cells | a + CASE WHEN c.kind = 'build' THEN c.files ELSE 0 END) AS buildFiles,
           reduce(a = 0, c IN cells | a + CASE WHEN c.kind = 'config' THEN c.files ELSE 0 END) AS configFiles,
           reduce(a = 0, c IN cells | a + CASE WHEN c.kind = 'data' THEN c.files ELSE 0 END) AS dataFiles,
           reduce(a = 0, c IN cells | a + CASE WHEN c.kind = 'other' THEN c.files ELSE 0 END) AS otherFiles,
           reduce(a = 0, c IN cells | a + CASE WHEN c.kind = 'source' THEN c.lines ELSE 0 END) AS sourceLines,
           reduce(a = 0, c IN cells | a + CASE WHEN c.kind = 'test' THEN c.lines ELSE 0 END) AS testLines,
           reduce(a = 0, c IN cells | a + CASE WHEN c.kind = 'docs' THEN c.lines ELSE 0 END) AS docsLines,
           languages, pr.sourceUrl AS url
    ORDER BY files DESC, number DESC

- name: GitHubChangeRequestSizeByAuthorKind
  description: >-
    SELECT THIS for "do the agents' PRs touch more files than people's in owner/repo", "mean PR
    size by author kind", "what share of the lines in agent PRs are tests", "do assisted pull
    requests ship documentation". For the change requests OPENED in a window: one row per
    authorKind, plus a row for all of them together, with the number of change requests, mean and
    largest files changed, mean and largest lines changed, the share of changed lines that are
    tests and that are docs (percent), and how many change requests touched a test file and a docs
    file. The same per-change-request diff fetch as GitHubChangeRequestSize; keep the window to a
    hundred or so.
  params:
    repo:  { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    since: { type: string, default: "2026-10-25T00:00:00Z", description: "ISO-8601 lower bound on openedAt, pushed to GitHub." }
    until: { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on openedAt; empty for no bound." }
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:HAS_ISSUE]->(pr:Issue)
    WITH pr, pr.updatedAt AS updatedAt, pr.isChangeRequest AS isPr, pr.openedAt AS openedAt
    WHERE updatedAt >= $since AND isPr = true AND openedAt >= $since AND ($until = '' OR openedAt < $until)
    MATCH (pr)-[:CHANGED]->(f:FileChange)
    WITH pr, pr.authorKind AS authorKind, count(f) AS files, sum(f.additions + f.deletions) AS lines,
         sum(CASE WHEN f.kind = 'test' THEN f.additions + f.deletions ELSE 0 END) AS testLines,
         sum(CASE WHEN f.kind = 'docs' THEN f.additions + f.deletions ELSE 0 END) AS docsLines
    UNWIND [authorKind, 'all'] AS kind
    WITH kind, count(pr) AS changeRequests,
         avg(files) AS meanFiles, max(files) AS maxFiles, avg(lines) AS meanLines, max(lines) AS maxLines,
         sum(lines) AS allLines, sum(testLines) AS allTestLines, sum(docsLines) AS allDocsLines,
         sum(CASE WHEN testLines > 0 THEN 1 ELSE 0 END) AS touchingTests,
         sum(CASE WHEN docsLines > 0 THEN 1 ELSE 0 END) AS touchingDocs
    RETURN kind AS authorKind, changeRequests, round(meanFiles, 1) AS meanFiles, maxFiles, round(meanLines, 1) AS meanLines, maxLines,
           CASE WHEN allLines = 0 THEN null ELSE round(100.0 * allTestLines / allLines, 1) END AS testLinesPct,
           CASE WHEN allLines = 0 THEN null ELSE round(100.0 * allDocsLines / allLines, 1) END AS docsLinesPct,
           touchingTests, touchingDocs
    ORDER BY CASE WHEN kind = 'all' THEN 1 ELSE 0 END, changeRequests DESC

# WHAT A CHANGE IS ABOUT. The kinds and languages above are facts read off paths. What a change
# CONCERNS — a fix, a feature, a refactor, a dependency bump — and which part of the system it
# touches are judgments, so they are asked of a model, one batched call per dimension over the
# window, reading the change request's own text (title, body, labels). The two are kept apart
# on purpose: a screenshot of a judgment should never pass for a count.

- name: GitHubChangeRequestConcern
  description: >-
    SELECT THIS for "what were the PRs in owner/repo about", "how many of last month's pull
    requests were bug fixes", "classify the PRs by what they concern", "which area of the code did
    the agents work on", "what kind of technology do the recent changes touch". For the change
    requests OPENED in a window: one row per change request with its author kind and status, a
    judged concern (one of feature, fix, refactor, test, docs, build, dependency, ci, performance,
    security, chore) and a judged area — the part of the system or the technology the change is
    about, in a few words — both read by a model from the title, body and labels. One batched model
    call per dimension over the window: keep it to a hundred or so. The concern and area are a
    model's opinion; the author kind and status are facts.
  params:
    repo:    { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    since:   { type: string, default: "2026-10-25T00:00:00Z", description: "ISO-8601 lower bound on openedAt, pushed to GitHub. Every change request in the window is judged; keep it small." }
    until:   { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on openedAt; empty for no bound." }
    concern: { type: string, default: "", description: "Leave empty for every change request, or one of feature, fix, refactor, test, docs, build, dependency, ci, performance, security, chore to keep only those." }
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:HAS_ISSUE]->(pr:Issue)
    WITH pr, pr.updatedAt AS updatedAt, pr.isChangeRequest AS isPr, pr.openedAt AS openedAt
    WHERE updatedAt >= $since AND isPr = true AND openedAt >= $since AND ($until = '' OR openedAt < $until)
    WITH pr, pr.number AS number, pr.title AS title, pr.authorLogin AS author, pr.authorKind AS authorKind,
         CASE WHEN pr.mergedAt IS NULL THEN pr.status ELSE 'merged' END AS status, pr.openedAt AS openedAt, pr.sourceUrl AS url,
         ai.classify(pr, 'What does this change request CONCERN, judged from its title, body and labels? feature: new behaviour or capability. fix: corrects a defect. refactor: restructures without changing behaviour. test: adds or changes tests only. docs: documentation only. build: build, packaging or tooling. dependency: bumps or changes a dependency. ci: continuous integration or workflows. performance: makes something faster or lighter. security: closes a vulnerability or hardens. chore: housekeeping that is none of the above. Answer one of: feature, fix, refactor, test, docs, build, dependency, ci, performance, security, chore') AS concern,
         ai.classify(pr, 'Which part of the system or which technology is this change request about? Answer in two to four words naming the component, subsystem, integration or technology it touches (for example "LLM provider config", "Virtual Cypher engine", "GitHub Actions workflow", "Spring Boot autoconfigure", "documentation site"). Prefer the project\'s own component names from the title and body.') AS area
    WHERE $concern = '' OR concern = $concern
    RETURN number, title, author, authorKind, status, openedAt, concern, area, url
    ORDER BY concern, openedAt DESC

- name: GitHubChangeRequestConcernMix
  description: >-
    SELECT THIS for "what mix of fixes and features did owner/repo ship last month", "how many
    PRs were dependency bumps", "what do the agents' PRs concern compared with people's", "share of
    bug fixes by author kind". For the change requests OPENED in a window: one row per judged
    concern and authorKind with the count — the same model judgment as GitHubChangeRequestConcern,
    aggregated. One batched model call over the window; keep it to a hundred or so.
  params:
    repo:  { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    since: { type: string, default: "2026-10-25T00:00:00Z", description: "ISO-8601 lower bound on openedAt, pushed to GitHub." }
    until: { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on openedAt; empty for no bound." }
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:HAS_ISSUE]->(pr:Issue)
    WITH pr, pr.updatedAt AS updatedAt, pr.isChangeRequest AS isPr, pr.openedAt AS openedAt
    WHERE updatedAt >= $since AND isPr = true AND openedAt >= $since AND ($until = '' OR openedAt < $until)
    WITH pr.authorKind AS authorKind,
         ai.classify(pr, 'What does this change request CONCERN, judged from its title, body and labels? feature: new behaviour or capability. fix: corrects a defect. refactor: restructures without changing behaviour. test: adds or changes tests only. docs: documentation only. build: build, packaging or tooling. dependency: bumps or changes a dependency. ci: continuous integration or workflows. performance: makes something faster or lighter. security: closes a vulnerability or hardens. chore: housekeeping that is none of the above. Answer one of: feature, fix, refactor, test, docs, build, dependency, ci, performance, security, chore') AS concern
    WITH concern, authorKind, count(*) AS changeRequests
    RETURN concern, authorKind, changeRequests ORDER BY changeRequests DESC, concern, authorKind

# WHAT THE PROJECT IS. Two facts and a reading. The forge's language table (bytes per language,
# as GitHub's linguist counts them, through WRITTEN_IN); and, where realm-java-project is
# installed, the project's own files at the default branch — the build manifests at its root,
# the CI it carries, and the `spring.*` keys in its configuration, which is how "Spring Boot" is
# a count of settings and not a guess. The opinion sentence is assembled from those facts by
# rule, not by a model, so it can be checked line by line against the two views it is built from.

- name: GitHubRepositoryLanguages
  description: >-
    SELECT THIS for "what languages is owner/repo written in", "language percentages of the repo",
    "how much Kotlin versus Java", "is this a TypeScript project". The repository's language table
    as GitHub counts it: one row per language with bytes of source and the share of the whole,
    largest first. One call, cached a day. Vendored and generated code is excluded by GitHub's own
    rules, which is why the shares differ from a raw file count.
  params:
    repo: { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:WRITTEN_IN]->(l:RepositoryLanguages)
    UNWIND l.languages AS entry
    WITH l, split(entry, ':')[0] AS language, toInteger(split(entry, ':')[1]) AS amount
    WITH l, collect({language: language, amount: amount}) AS rows, sum(amount) AS total
    UNWIND rows AS r
    RETURN r.language AS language, r.amount AS bytes, round(100.0 * r.amount / total, 1) AS sharePct, l.unit AS unit
    ORDER BY bytes DESC

- name: GitHubRepositoryProfile
  description: >-
    SELECT THIS for "what kind of project is owner/repo", "is it Spring Boot or Node", "what
    stack does this repository use", "describe the project", "what build tool does it use". One
    row: the languages by share (from GitHub's table), the build tools and package managers read
    off the manifests at the project root (pom.xml, build.gradle, package.json, pyproject.toml,
    go.mod, Cargo.toml, Dockerfile, flake.nix and the like), whether it runs GitHub Actions, how
    many Spring settings its configuration declares (spring.*, and spring.ai.* for Spring AI), the
    file count by extension, and an opinion sentence assembled from exactly those facts by rule.
    Needs realm-java-project installed for the files and settings (it reads the repository at
    its default branch; the first read clones it). Where a project's framework is not visible in
    settings or manifests — a Node framework named only inside package.json — the opinion says
    what it saw and no more.
  params:
    repo: { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:WRITTEN_IN]->(l:RepositoryLanguages)
    UNWIND l.languages AS entry
    WITH l.repositoryKey AS repositoryKey, split(entry, ':')[0] AS language, toInteger(split(entry, ':')[1]) AS amount
    ORDER BY amount DESC
    WITH repositoryKey, collect({language: language, amount: amount}) AS langs, sum(amount) AS total
    WITH repositoryKey, [x IN langs WHERE 100.0 * x.amount / total >= 1.0 | x.language + ' ' + toString(round(100.0 * x.amount / total, 1)) + '%'] AS languages,
         head(langs).language AS primaryLanguage
    OPTIONAL MATCH (:JavaProject {key: 'https://github.com/' + $repo})-[:HAS_FILE]->(f:ProjectFile)
    WITH repositoryKey, languages, primaryLanguage, collect({path: f.path, name: f.fileName, ext: f.extension}) AS files
    WITH repositoryKey, languages, primaryLanguage, files,
         [x IN files WHERE NOT x.path CONTAINS '/' | x.name] AS rootFiles,
         size([x IN files WHERE x.path STARTS WITH '.github/workflows/']) AS workflowFiles
    WITH repositoryKey, languages, primaryLanguage, files, rootFiles, workflowFiles,
         [t IN [
            CASE WHEN 'pom.xml' IN rootFiles THEN 'Maven' ELSE '' END,
            CASE WHEN any(n IN rootFiles WHERE n IN ['build.gradle', 'build.gradle.kts', 'settings.gradle', 'settings.gradle.kts']) THEN 'Gradle' ELSE '' END,
            CASE WHEN 'package.json' IN rootFiles THEN CASE WHEN 'pnpm-lock.yaml' IN rootFiles THEN 'pnpm' WHEN 'yarn.lock' IN rootFiles THEN 'Yarn' ELSE 'npm' END ELSE '' END,
            CASE WHEN 'pyproject.toml' IN rootFiles THEN 'Python (pyproject)' WHEN any(n IN rootFiles WHERE n STARTS WITH 'requirements') THEN 'pip' ELSE '' END,
            CASE WHEN 'go.mod' IN rootFiles THEN 'Go modules' ELSE '' END,
            CASE WHEN 'Cargo.toml' IN rootFiles THEN 'Cargo' ELSE '' END,
            CASE WHEN 'Gemfile' IN rootFiles THEN 'Bundler' ELSE '' END,
            CASE WHEN any(n IN rootFiles WHERE n ENDS WITH '.sln' OR n ENDS WITH '.csproj') THEN '.NET' ELSE '' END,
            CASE WHEN 'CMakeLists.txt' IN rootFiles THEN 'CMake' WHEN 'Makefile' IN rootFiles THEN 'Make' ELSE '' END,
            CASE WHEN any(n IN rootFiles WHERE n STARTS WITH 'Dockerfile' OR n STARTS WITH 'docker-compose' OR n STARTS WITH 'compose.') THEN 'Docker' ELSE '' END,
            CASE WHEN 'flake.nix' IN rootFiles THEN 'Nix' ELSE '' END,
            CASE WHEN workflowFiles > 0 THEN 'GitHub Actions' ELSE '' END
         ] WHERE t <> ''] AS buildTools
    OPTIONAL MATCH (:JavaProject {key: 'https://github.com/' + $repo})-[:HAS_SETTING]->(s:ProjectSetting)
    WITH repositoryKey, languages, primaryLanguage, files, rootFiles, buildTools,
         sum(CASE WHEN s.name STARTS WITH 'spring.' THEN 1 ELSE 0 END) AS springSettings,
         sum(CASE WHEN s.name STARTS WITH 'spring.ai.' THEN 1 ELSE 0 END) AS springAiSettings,
         count(DISTINCT CASE WHEN s.name STARTS WITH 'spring.' THEN s.path ELSE null END) AS springSettingFiles
    UNWIND (CASE WHEN size(files) = 0 THEN [null] ELSE files END) AS fx
    WITH repositoryKey, languages, primaryLanguage, rootFiles, buildTools, springSettings, springAiSettings, springSettingFiles, size(files) AS fileCount,
         CASE WHEN fx IS NULL THEN '' ELSE fx.ext END AS ext, count(fx) AS n
    ORDER BY n DESC
    WITH repositoryKey, languages, primaryLanguage, rootFiles, buildTools, springSettings, springAiSettings, springSettingFiles, fileCount,
         collect(CASE WHEN ext = '' THEN null ELSE ext + ':' + toString(n) END) AS extensions
    WITH repositoryKey, languages, primaryLanguage, rootFiles, buildTools, springSettings, springAiSettings, springSettingFiles, fileCount, extensions[0..8] AS filesByExtension
    WITH repositoryKey, languages, primaryLanguage, rootFiles, buildTools, springSettings, springAiSettings, springSettingFiles, fileCount, filesByExtension,
         CASE WHEN springSettings > 0 THEN 'Spring Boot' ELSE '' END AS framework
    RETURN repositoryKey AS repository, primaryLanguage, languages, buildTools,
           CASE WHEN framework = '' THEN [] ELSE [framework] + CASE WHEN springAiSettings > 0 THEN ['Spring AI'] ELSE [] END END AS frameworks,
           springSettings, springAiSettings, springSettingFiles, fileCount, filesByExtension,
           CASE WHEN fileCount = 0 THEN
                'Written mostly in ' + coalesce(primaryLanguage, 'an unknown language') + ' (' + reduce(a = '', x IN languages | CASE WHEN a = '' THEN x ELSE a + ', ' + x END) + '); the project files were not read, so the build tool and framework are not known here.'
           ELSE
                'A ' + coalesce(primaryLanguage, '') + ' project (' + reduce(a = '', x IN languages | CASE WHEN a = '' THEN x ELSE a + ', ' + x END) + ')'
                + CASE WHEN size(buildTools) = 0 THEN ' with no build manifest at its root' ELSE ' built with ' + reduce(a = '', x IN buildTools | CASE WHEN a = '' THEN x ELSE a + ', ' + x END) END
                + CASE WHEN springSettings > 0 THEN '; Spring Boot, judging by ' + toString(springSettings) + ' spring.* settings in ' + toString(springSettingFiles) + ' configuration files' + CASE WHEN springAiSettings > 0 THEN ', ' + toString(springAiSettings) + ' of them Spring AI' ELSE '' END ELSE '; no Spring settings in its configuration' END
                + '; ' + toString(fileCount) + ' files.'
           END AS opinion

# WHO MAKES THE CHANGES, AND WHAT ELSE THE WORLD KNOWS ABOUT THEM. A commit carries the author's
# email, and the vocabulary's authorPersonEmail keys the world's Person spine for a person at a
# real mailbox (never a bot, an agent or a no-reply address). So a commit author is the same node
# as the CRM contact, the helpdesk agent or the employee the world already holds, matched on any
# of that person's addresses. The view lists what the world holds beside the commits.
# The Person is reached through the user's HAS_CONTACT edge, not by a bare (p:Person): a person the
# hub minted from a commit is not yet visible to the bare form in the minting user's scope
# (embabel/me#3624); the contact edge reaches every person the world holds for the user either way.

- name: GitHubCommitAuthors
  description: >-
    SELECT THIS for "who is committing to owner/repo", "what do we know about the people making
    the changes", "which committers are also customers or contacts", "commit authors and their
    company", "who wrote the most code last month and who are they". For the non-merge commits
    authored since a date: one row per author (login and email as the commits record them) with the names they committed
    under, the author kinds seen (a person is `human` on one commit and `assisted` on the next),
    the number of commits and how many were assisted, and what the world knows about that person
    through its Person spine: the canonical name, every email the world has for them, which
    sources contributed the person, and what else is linked to them (counts by type). An author
    with nothing beyond the commits is a person the world meets here for the first time. Bots,
    agents and no-reply addresses never reach the spine and say so.
  params:
    repo:  { type: string, default: "embabel/embabel-agent", description: "Repository as owner/repo." }
    since: { type: string, default: "2026-10-01T00:00:00Z", description: "ISO-8601 lower bound on the author date, pushed to GitHub." }
    until: { type: string, default: "", description: "ISO-8601 upper bound (exclusive) on the author date; empty for no bound." }
  cypher: |
    MATCH (:GitHubRepository {full_name: $repo})-[:HAS_COMMIT]->(c:Commit)
    WITH c, c.authoredAt AS authoredAt, c.isMerge AS isMerge
    WHERE authoredAt >= $since AND ($until = '' OR authoredAt < $until) AND isMerge = false
    WITH c.authorLogin AS login, c.authorEmail AS email, c.authorPersonEmail AS personEmail,
         collect(DISTINCT c.authorName) AS names, collect(DISTINCT c.authorKind) AS authorKinds,
         count(c) AS commits, sum(CASE WHEN c.authorKind = 'assisted' THEN 1 ELSE 0 END) AS assistedCommits, max(authoredAt) AS lastCommitAt
    OPTIONAL MATCH (:AssistantUser)-[:HAS_CONTACT]->(p:Person) WHERE personEmail <> '' AND personEmail IN p.emails
    OPTIONAL MATCH (p)-[r]-(x) WHERE NOT x:EmailAddress AND NOT x:AssistantUser AND NOT x:Person
    WITH login, email, personEmail, names, authorKinds, commits, assistedCommits, lastCommitAt, p,
         collect(DISTINCT head([l IN labels(x) WHERE NOT l STARTS WITH '__'])) AS linkedTypes
    RETURN login, email, names, authorKinds, commits, assistedCommits, lastCommitAt,
           CASE WHEN personEmail = '' THEN 'not a person at a mailbox: no spine' WHEN p IS NULL THEN 'person, not yet on the spine' ELSE 'on the spine' END AS personStatus,
           p.name AS personName, p.emails AS personEmails, p.sources AS personSources,
           [t IN linkedTypes WHERE t IS NOT NULL] AS linkedTypes
    ORDER BY commits DESC, login
