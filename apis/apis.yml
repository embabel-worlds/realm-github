# GitHub OpenAPI 3 spec — official, lives in github/rest-api-description.
#
# Curation strategy: the full spec is ~600 operations. Even narrowing
# to five tag groups (issues, pulls, repos, users, search) leaves ~150
# ops — too much for the chat prompt once typed responses are inlined.
# Instead we pin an explicit operationIds allowlist of the ~15 ops that
# cover ~95% of common chat tasks. Add more here when a need arises.
#
# Auth: a GitHub token. The entry declares one credential, named `gh`, and the owner binds a
# wallet item holding a token to it; `token-env` names the variable an appliance fills that
# item from. Reads and writes both go out with that token, so a write is attributed to the
# token's owner. See README.md for setup.
# VENDORED, TRIMMED spec (sibling file) — never the remote URL: a remote spec is
# re-downloaded (12.8MB) per workspace build, per user, serially at boot; the local
# file parses once per process (mtime-keyed, shared across users). The file holds the
# operation-ids pinned below plus their $ref closure (435KB). When ADDING an operation
# id, regenerate it from the official github/rest-api-description spec with
# embabel.com/assistant scripts/test/trim-openapi.py, which also puts request bodies in the
# shape the realm host reads (no body on a GET; a write body is one application/json schema).
# Then check each write body by hand: pick the one form of each field GitHub accepts that the
# verbs send, which is label names and assignee logins as strings and a milestone as its integer
# number. tests/gateway-contract.test.ts checks that the verbs' calls fit the document.
- url: "api.github.com.json"
  name: gh
  type: openapi
  auth: bearer
  token-env: GH_TOKEN
  headers:
    Accept: "application/vnd.github+json"
    X-GitHub-Api-Version: "2022-11-28"
  # The OAuth declaration, kept as a comment for a host that should act as each user's own
  # GitHub account. An entry is token auth or OAuth, never both: switching to `auth: oauth2`
  # refuses every call, reads included, for a user who has not connected an account.
  # Keep it a comment, never a renamed key: hosts before v0.4.4 reject an entry carrying a
  # field they do not know, which dropped this whole API from the world.
  # oauth2:
  #   auth-url: https://github.com/login/oauth/authorize
  #   token-url: https://github.com/login/oauth/access_token
  #   # Maximum reasonable scope — broad enough for any assistant tool,
  #   # narrow enough to exclude genuinely destructive operations.
  #   #   repo           : private+public read/write (issues, PRs, contents)
  #   #   workflow       : edit .github/workflows/* (needed for CI changes)
  #   #   notifications  : read+mark notifications
  #   #   read:org       : see org membership for context resolution
  #   #   read:user      : authenticated user profile
  #   #   user:email     : user's email addresses
  #   #   gist           : gists/list-for-user and friends
  #   # Explicitly NOT included (add only when needed):
  #   #   delete_repo, admin:org, admin:repo_hook, admin:public_key
  #   scopes: repo workflow notifications read:org read:user user:email gist
  #   # GitHub /user endpoint returns the authenticated user's profile.
  #   # `login` is the canonical account id (unique, stable). `name` is
  #   # the display label shown in Connected Services.
  #   identity:
  #     url: https://api.github.com/user
  #     method: GET
  #     account-id-field: login
  #     display-name-field: name
  # Writes are declared as writes. The host reads a listed operation as a GET with no body and
  # refuses the whole entry when a POST sits among the reads, which is what kept every call of
  # this realm unapprovable; a write id here is checked against the same vendored document and
  # destination rules, and the verbs in src/api/issue.ts and src/api/pull-request.ts call
  # these. add-labels / add-assignees are additive (idempotent per label/assignee), the honest
  # fit for `issue.addLabels(...)` / `issue.assign(...)`; close/reopen/comment/addLabels/assign
  # on a pull request reuse the issues/* operations, since a PR IS an issue for state, comments,
  # labels and assignees.
  write-operation-ids:
    - issues/create
    - issues/update
    - issues/create-comment
    - issues/add-labels
    - issues/add-assignees
    - pulls/create
    - pulls/merge
    - pulls/request-reviewers
  operation-ids:
    # Issues
    - issues/list-for-repo
    - issues/get
    - issues/list-comments
    - issues/list-comments-for-repo
    # Pull requests
    - pulls/list
    - pulls/get
    - pulls/list-files
    - pulls/list-commits
    - pulls/list-reviews
    - pulls/list-review-comments
    - pulls/list-review-comments-for-repo
    # Repositories
    - repos/get
    - repos/list-for-user
    - repos/list-for-authenticated-user
    - repos/list-commits
    - repos/get-commit
    - repos/list-branches
    - repos/list-tags
    - repos/list-contributors
    - repos/list-releases
    - repos/get-latest-release
    - repos/get-readme
    - repos/get-content
    - repos/list-languages    # the language table behind RepositoryLanguages
    # Gists
    - gists/list-for-user
    # Users
    - users/get-by-username
    - users/get-authenticated
    # Search
    - search/issues-and-pull-requests
    - search/users
    - search/repos
    - search/code
    # Activity — used by `events/mention.yml`'s poll to read user-scoped
    # notifications with `reason=mention`. The poll executor consumes the
    # response items and projects each into a `GitHubMentioned` DynamicSignal.
    - activity/list-notifications-for-authenticated-user
