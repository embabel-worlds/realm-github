# GitHub OpenAPI 3 spec — official, lives in github/rest-api-description.
#
# Curation strategy: the full spec is ~600 operations. Even narrowing
# to five tag groups (issues, pulls, repos, users, search) leaves ~150
# ops, too much for the chat prompt once typed responses are inlined.
# Instead we pin an explicit allowlist of 36 ops that cover the
# common chat tasks: reads under `operation-ids`, writes under
# `write-operation-ids`. An id goes in one list, never both. Add more
# here when a need arises.
#
# Auth: GitHub OAuth (OAuth App or GitHub App user-to-server flow).
# Operator-supplied `client_id` + `client_secret` are stored in the
# assistant's Wallet under provider name `gh`. Access tokens are
# persisted under `gh_OAUTH2#${login}` after the user authorizes.
# See README.md for setup.
# VENDORED, TRIMMED spec (sibling file), never the remote URL: a remote spec is
# re-downloaded (12.8MB) per workspace build, per user, serially at boot; the local
# file parses once per process (mtime-keyed, shared across users). The file holds the
# operation-ids and write-operation-ids pinned below plus their $ref closure (435KB).
# When ADDING an operation id, regenerate it from the official
# github/rest-api-description spec with embabel.com/assistant
# scripts/test/trim-openapi.py, then reduce each write's request body by hand to
# `content` > `application/json` > `schema` using only type, properties, required,
# items, enum and description. The host refuses anything else (oneOf, nullable,
# minItems, format, a request-level `required`), so pick the one form of each field
# that GitHub accepts and that means the same thing (for example label names as
# strings, a milestone as its integer number). tests/gateway-contract.test.ts checks
# the subset and that the verbs' calls fit it.
- url: "api.github.com.json"
  name: gh
  type: openapi
  auth: oauth2
  oauth2:
    auth-url: https://github.com/login/oauth/authorize
    token-url: https://github.com/login/oauth/access_token
    # Maximum reasonable scope — broad enough for any assistant tool,
    # narrow enough to exclude genuinely destructive operations.
    #   repo           : private+public read/write (issues, PRs, contents)
    #   workflow       : edit .github/workflows/* (needed for CI changes)
    #   notifications  : read+mark notifications
    #   read:org       : see org membership for context resolution
    #   read:user      : authenticated user profile
    #   user:email     : user's email addresses
    #   gist           : gists/list-for-user and friends
    # Explicitly NOT included (add only when needed):
    #   delete_repo, admin:org, admin:repo_hook, admin:public_key
    scopes: repo workflow notifications read:org read:user user:email gist
    # GitHub /user endpoint returns the authenticated user's profile.
    # `login` is the canonical account id (unique, stable). `name` is
    # the display label shown in Connected Services.
    identity:
      url: https://api.github.com/user
      method: GET
      account-id-field: login
      display-name-field: name
  # Writes are listed apart from reads: a read is always a GET with no body.
  # A write takes its request body under the reserved `body` argument; every
  # other argument is a path or query parameter.
  write-operation-ids:
    - issues/create
    - issues/update
    - issues/create-comment
    # Verb write-backs on a materialized GitHubIssue (src/api/issue.ts):
    # add-labels / add-assignees are additive (idempotent per label/assignee),
    # the honest fit for `issue.addLabels(...)` / `issue.assign(...)`.
    - issues/add-labels
    - issues/add-assignees
    - pulls/create
    # Verb write-backs on a materialized GitHubPullRequest (src/api/pull-request.ts).
    # (close/reopen/comment/addLabels/assign reuse the issues/* ops above: a PR
    # IS an issue for state, comments, labels and assignees.)
    - pulls/merge
    - pulls/request-reviewers
  operation-ids:
    # Issues
    - issues/list-for-repo
    - issues/get
    - issues/list-comments
    # Pull requests
    - pulls/list
    - pulls/get
    - pulls/list-files
    - pulls/list-commits
    - pulls/list-reviews
    - pulls/list-review-comments
    # Repositories
    - repos/get
    - repos/list-for-user
    - repos/list-for-authenticated-user
    - repos/list-commits
    - repos/list-branches
    - repos/list-tags
    - repos/list-contributors
    - repos/list-releases
    - repos/get-latest-release
    - repos/get-readme
    - repos/get-content
    # Gists
    - gists/list-for-user
    # Users
    - users/get-by-username
    - users/get-authenticated
    # Search
    - search/issues-and-pull-requests
    - search/users
    - search/repos
    - search/code
    # Activity — used by `events/mention.yml`'s poll to read user-scoped
    # notifications with `reason=mention`. The poll executor consumes the
    # response items and projects each into a `GitHubMentioned` DynamicSignal.
    - activity/list-notifications-for-authenticated-user
