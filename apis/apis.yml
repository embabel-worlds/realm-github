# GitHub OpenAPI 3 spec — official, lives in github/rest-api-description.
#
# Curation strategy: the full spec is ~600 operations. Even narrowing
# to five tag groups (issues, pulls, repos, users, search) leaves ~150
# ops — too much for the chat prompt once typed responses are inlined.
# Instead we pin an explicit operationIds allowlist of the ~15 ops that
# cover ~95% of common chat tasks. Add more here when a need arises.
#
# Auth: GitHub OAuth (OAuth App or GitHub App user-to-server flow).
# Operator-supplied `client_id` + `client_secret` are stored in the
# assistant's Wallet under provider name `gh`. Access tokens are
# persisted under `gh_OAUTH2#${login}` after the user authorizes.
# See README.md for setup.
- url: "https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json"
  name: gh
  type: openapi
  auth: oauth2
  oauth2:
    auth-url: https://github.com/login/oauth/authorize
    token-url: https://github.com/login/oauth/access_token
    # Maximum reasonable scope — broad enough for any assistant tool,
    # narrow enough to exclude genuinely destructive operations.
    #   repo           : private+public read/write (issues, PRs, contents)
    #   workflow       : edit .github/workflows/* (needed for CI changes)
    #   notifications  : read+mark notifications
    #   read:org       : see org membership for context resolution
    #   read:user      : authenticated user profile
    #   user:email     : user's email addresses
    #   gist           : gists/list-for-user and friends
    # Explicitly NOT included (add only when needed):
    #   delete_repo, admin:org, admin:repo_hook, admin:public_key
    scopes: repo workflow notifications read:org read:user user:email gist
    # GitHub /user endpoint returns the authenticated user's profile.
    # `login` is the canonical account id (unique, stable). `name` is
    # the display label shown in Connected Services.
    identity:
      url: https://api.github.com/user
      method: GET
      account-id-field: login
      display-name-field: name
  operation-ids:
    # Issues
    - issues/list-for-repo
    - issues/get
    - issues/create
    - issues/update
    - issues/list-comments
    - issues/create-comment
    # Pull requests
    - pulls/list
    - pulls/get
    - pulls/create
    - pulls/list-files
    - pulls/list-commits
    - pulls/list-reviews
    - pulls/list-review-comments
    - pulls/merge
    # Repositories
    - repos/get
    - repos/list-for-user
    - repos/list-for-authenticated-user
    - repos/list-commits
    - repos/list-branches
    - repos/list-tags
    - repos/list-contributors
    - repos/list-releases
    - repos/get-latest-release
    - repos/get-readme
    - repos/get-content
    # Gists
    - gists/list-for-user
    # Users
    - users/get-by-username
    - users/get-authenticated
    # Search
    - search/issues-and-pull-requests
    - search/users
    - search/repos
    - search/code
    # Activity — used by `events/mention.yml`'s poll to read user-scoped
    # notifications with `reason=mention`. The poll executor consumes the
    # response items and projects each into a `github.mention` DynamicSignal.
    - activity/list-notifications-for-authenticated-user
