# GitHub OpenAPI 3 spec — official, lives in github/rest-api-description.
#
# Curation strategy: the full spec is ~600 operations. Even narrowing
# to five tag groups (issues, pulls, repos, users, search) leaves ~150
# ops — too much for the chat prompt once typed responses are inlined.
# Instead we pin an explicit operationIds allowlist of the ~15 ops that
# cover ~95% of common chat tasks. Add more here when a need arises.
#
# Auth: GitHub App (`embabel`) + PKCE. Single Embabel-owned App across all
# deployments; no per-deployment registration, no client_secret. Tokens land
# in the wallet credential store under `gh_OAUTH2#${login}` and rotate
# (~8h access, ~6mo refresh). Permissions are declared at App registration
# (installation-time, fine-grained per-repo) rather than via OAuth scopes —
# hence no `scopes:` entry below.
#
# User flow: Settings → Connected Services → Authorize for GitHub. If the
# App isn't installed on the chosen account yet, GitHub shows its install
# screen (pick repos) before consent; otherwise jumps straight to consent.
# The "Manage installation on GitHub" link in the same UI takes the user
# to the install page to add/remove repos later.
#
# No per-deployment setup: `client-id` is public, `pkce: true` means
# `OAuth2Service` follows the PKCE path and never looks for a client_secret.
- url: "https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json"
  name: gh
  type: openapi
  auth: oauth2
  oauth2:
    auth-url: https://github.com/login/oauth/authorize
    token-url: https://github.com/login/oauth/access_token
    client-id: Iv23li70Lfuicc09bB4l
    pkce: true
    install-url: https://github.com/apps/embabel/installations/new
    # GitHub /user endpoint returns the authenticated user's profile.
    # `login` is the canonical account id (unique, stable). `name` is
    # the display label shown in Connected Services.
    identity:
      url: https://api.github.com/user
      method: GET
      account-id-field: login
      display-name-field: name
  operation-ids:
    # Issues
    - issues/list-for-repo
    - issues/get
    - issues/create
    - issues/update
    - issues/list-comments
    - issues/create-comment
    # Pull requests
    - pulls/list
    - pulls/get
    - pulls/create
    - pulls/list-files
    - pulls/list-commits
    - pulls/list-reviews
    - pulls/list-review-comments
    - pulls/merge
    # Repositories
    - repos/get
    - repos/list-for-user
    - repos/list-for-authenticated-user
    - repos/list-commits
    - repos/list-branches
    - repos/list-tags
    - repos/list-contributors
    - repos/list-releases
    - repos/get-latest-release
    - repos/get-readme
    - repos/get-content
    # Gists
    - gists/list-for-user
    # Users
    - users/get-by-username
    - users/get-authenticated
    # Search
    - search/issues-and-pull-requests
    - search/users
    - search/repos
    - search/code
